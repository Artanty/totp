name: Deploy back to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Export .env to GitHub env
      run: |
        node - <<'EOF'
        const fs = require('fs');
        const { parse } = require('dotenv');
        if (!fs.existsSync('.env')) throw new Error('.env not found in checkout');
        const file = fs.readFileSync('.env');
        const parsed = parse(file);
        const out = [];
        for (const [key, val] of Object.entries(parsed)) {
          if (/[\n\r]/.test(val)) {
            out.push(`${key}<<EOF\n${val}\nEOF`);
          } else {
            console.log(`::add-mask::${val}`);
            out.push(`${key}=${val}`);
          }
        }
        const envB64 = file.toString('base64');
        console.log(`::add-mask::${envB64}`);
        out.push(`SERVER_ENV_B64=${envB64}`);
        fs.appendFileSync(process.env.GITHUB_ENV, out.join('\n') + '\n');
        EOF

    - name: Validate required env
      run: |
        missing=""
        for k in SSH_HOST SSH_USER USER_PASS REVERSED_PROXY_SLOT; do
          if [ -z "${!k}" ]; then missing="$missing $k"; fi
        done
        if [ -n "$missing" ]; then
          echo "Missing env vars; add them to project envs in safe and re-run serf:$missing" >&2
          exit 1
        fi

    - name: Build
      run: npm run build

    - name: Verify totp client component is built
      run: |
        set -e
        cd dist/public/client
        test -f remoteEntry.js || { echo 'remoteEntry.js missing after build' >&2; exit 1; }
        for chunk in remoteEntry.js core-*.js gate-*.js chunk-*.js; do
          [ -f "$chunk" ] || { echo "missing $chunk" >&2; exit 1; }
        done
        echo 'Totp client component files:'
        ls -1

    - name: Stage deploy artifacts
      run: |
        mkdir -p deploy
        cp -r dist src/generated prisma package.json package-lock.json prisma.config.ts deploy/
        cp src/generated/prisma/libquery_engine-*.so.node deploy/dist/generated/prisma/
        ls -la deploy/dist/generated/prisma | grep libquery_engine

    - name: Copy folder content recursively to remote
      uses: garygrossgarten/github-action-scp@release
      with:
        local: ./deploy
        remote: ${{ env.REVERSED_PROXY_SLOT }}
        host: ${{ env.SSH_HOST }}
        username: ${{ env.SSH_USER }}
        password: ${{ env.USER_PASS }}

    - name: Executing remote ssh commands using password
      uses: appleboy/ssh-action@master
      with:
        host: ${{ env.SSH_HOST }}
        username: ${{ env.SSH_USER }}
        password: ${{ env.USER_PASS }}
        envs: SERVER_ENV_B64
        script: |
          set -e
          cd /root/${{ env.REVERSED_PROXY_SLOT }}
          if [ -n "$SERVER_ENV_B64" ]; then
            cp .env ".env.bak.$(date +%s)" 2>/dev/null || true
            echo "$SERVER_ENV_B64" | base64 -d > .env.incoming
            node - <<'NODE'
              const fs = require('fs');
              function parse(text) {
                const entries = [];
                for (const line of text.split(/\r?\n/)) {
                  const t = line.trim();
                  if (!t || t.startsWith('#') || !t.includes('=')) continue;
                  const i = line.indexOf('=');
                  entries.push([line.slice(0, i).trim(), line.slice(i + 1)]);
                }
                return entries;
              }
              const map = new Map();
              for (const [k, v] of parse(fs.existsSync('.env') ? fs.readFileSync('.env', 'utf8') : '')) map.set(k, v);
              for (const [k, v] of parse(fs.readFileSync('.env.incoming', 'utf8'))) map.set(k, v);
              fs.writeFileSync('.env', [...map].map(([k, v]) => `${k}=${v}`).join('\n') + '\n');
              fs.unlinkSync('.env.incoming');
            NODE
          fi
          npm ci --omit=dev
          npx --yes prisma@6.19.3 migrate deploy
          systemctl restart ${{ env.REVERSED_PROXY_SLOT }}
          systemctl --no-pager --lines=5 status ${{ env.REVERSED_PROXY_SLOT }}